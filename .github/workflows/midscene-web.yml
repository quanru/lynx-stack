name: Midscene AI E2E (web-core shell)

# AI-driven E2E on lynx-stack's web-core-e2e dev shell.
# Overlays Midscene vision on top of Playwright: the ReactLynx page renders
# inside a <lynx-view> open shadow root and worker. Midscene drives visible
# interactions; precise resource and event checks remain separate assertions.
#
# Required repository secrets:
#   MIDSCENE_MODEL_API_KEY / NAME / BASE_URL / FAMILY
# Optional:
#   MIDSCENE_MODEL_REASONING_ENABLED
# Optional repository variables:
#   MIDSCENE_PAGES_BRANCH  e.g. "main" — publish HTML report to GitHub Pages
#                          (defaults to the repository default branch).
#                          Same-repository pull
#                          requests also publish review evidence.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &ai-e2e-paths
      - ".github/workflows/midscene-web.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/workflow-pages.yml"
      - ".github/scripts/compose-pages-site*"
      - ".github/workflows/workflow-website.yml"
      - ".github/workflows/deploy-main.yml"
      - ".github/scripts/preflight-model.sh"
      - ".github/scripts/vision-preflight*"
      # Original contracts, browser profiles and PNG baselines are inputs too.
      - "packages/web-platform/web-core-e2e/**"
      - "packages/web-platform/playwright-fixtures/**"
      - "packages/web-platform/web-core/**"
      - "packages/web-platform/web-elements/**"
  pull_request:
    branches: [main]
    paths: *ai-e2e-paths
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: midscene-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection

jobs:
  renderer-parity:
    name: Check cross-repository report renderer parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash packages/web-platform/web-core-e2e/midscene/scripts/check-renderer-parity.sh
      - run: node --test .github/scripts/compose-pages-site.test.mjs

  fork-contract-check:
    name: Midscene contract check (external fork)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Check types and report contract without model credentials
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node --test scripts/*.test.mjs
          node --test ../../../../.github/scripts/vision-preflight.test.mjs

  web-shell-ai-e2e:
    name: Midscene AI E2E · Web
    needs: [renderer-parity]
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Provider retries do not change case retries or assertion deadlines.
      MIDSCENE_MODEL_RETRY_COUNT: "2"
      MIDSCENE_MODEL_RETRY_INTERVAL: "30000"
    # Same image the official Playwright web jobs use: browsers preinstalled
    # (/ms-playwright) and system libraries ready for all three browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-resolute
      env:
        CI: "1"
        TURBO_TELEMETRY_DISABLED: "1"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Align container home ownership for Firefox
        shell: bash
        # GitHub mounts /github/home with the image's pwuser ownership, while
        # this root container needs apt/corepack for the source build. Firefox
        # refuses root launches when that home directory belongs to another UID.
        # Change only the container mount's directory owner, never HOME or files.
        run: |
          set -euo pipefail
          test "$(id -u)" = "0"
          test -d /github/home
          test ! -L /github/home
          chown -- "$(id -u):$(id -g)" /github/home
          test "$(stat -c %u /github/home)" = "$(id -u)"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.4.0 --activate
          pnpm --version

      - name: Install Midscene test dependencies
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: npm ci --no-audit --no-fund

      - name: Collect expected Web cases before runtime prerequisites
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: node scripts/expected-cases.mjs collect

      - name: Preflight model endpoint
        working-directory: packages/web-platform/web-core-e2e/midscene
        env: &midscene-model-env
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME || secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL || secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY || secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_MODEL_REASONING_ENABLED: ${{ vars.MIDSCENE_MODEL_REASONING_ENABLED || secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
        run: bash ../../../../.github/scripts/preflight-model.sh

      - name: Verify Midscene model compatibility
        id: model-compatible
        working-directory: packages/web-platform/web-core-e2e/midscene
        env: *midscene-model-env
        run: npm run check:model

      - name: Install Rust toolchain (web-core build:wasm)
        # Container jobs default to `sh` (dash), which has no `source`;
        # pin bash explicitly.
        shell: bash
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config curl ca-certificates >/dev/null
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 -fsSL https://sh.rustup.rs \
              | sh -s -- --default-toolchain none -y
          fi
          . "$HOME/.cargo/env"
          # rust-toolchain.toml pins channel 1.97.1; install its wasm targets.
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown wasm32-wasip1
          # Make cargo/rustc available to every later step (turbo build:wasm).
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web-core-e2e dependency closure
        id: build-web
        # Includes web-core (Rust -> wasm), rspeedy and the ReactLynx plugin
        # chain; the package's own build:csr emits dist/*.web.bundle.
        run: |
          pnpm turbo build --filter='@lynx-js/web-core-e2e...'

      - name: Validate original server-rendering HTML snapshots
        id: original-html
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        # Deterministic non-UI contracts retain their original runner and snapshots.
        # CI forbids creating missing snapshots; never pass an update flag.
        run: pnpm exec rstest --config rstest.config.ts

      # Original Playwright runners own their server lifecycle in CI. Run them
      # before the persistent Midscene servers, never weaken reuse guards.
      - name: Validate existing original runner collection without launching browsers
        id: original-collection
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' }}
        run: |
          node packages/web-platform/web-core-e2e/midscene/scripts/check-original-runner-collection.mjs
          node --test packages/web-platform/web-core-e2e/midscene/scripts/required-browser-coverage.integration.mjs

      - name: Validate original worker and runtime API contracts
        id: original-runtime
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ORIGINAL_EVIDENCE_RUNNER: runtime
        run: pnpm exec playwright test tests/web-core.test.ts --project chromium --project firefox --project webkit --workers=2 --output midscene-original-results/runtime/results --config playwright.original-evidence.config.ts

      - name: Validate original keyboard event contracts (CSR)
        id: original-keyboard-csr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ENABLE_SSR: ""
          ORIGINAL_EVIDENCE_RUNNER: keyboard-csr
        # Key-down/up separation and absence of focus are original inputs.
        # A combined AI keypress or preparatory click changes these contracts.
        run: pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep 'basic-(global-bindkeydown(-key|-code|-shift)?|global-bindkeyup|bindkeydown-out-of-view-noop)$' --output midscene-original-results/keyboard-csr/results --config playwright.original-evidence.config.ts

      - name: Validate original keyboard event contracts (SSR)
        id: original-keyboard-ssr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ENABLE_SSR: "1"
          ORIGINAL_EVIDENCE_RUNNER: keyboard-ssr
        run: pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep 'basic-(global-bindkeydown(-key|-code|-shift)?|global-bindkeyup|bindkeydown-out-of-view-noop)$' --output midscene-original-results/keyboard-ssr/results --config playwright.original-evidence.config.ts

      - name: Validate original pointer event contracts (CSR)
        id: original-pointer-csr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ORIGINAL_EVIDENCE_RUNNER: pointer-csr
          ENABLE_SSR: ""
        # Touch payloads, separate mouse phases and wheel deltas are the inputs
        # under test. Preserve their original runner and browser exclusions.
        run: |
          echo "open files limit before: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
          ulimit -Sn "$(ulimit -Hn)"
          echo "open files limit after: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
          pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep 'basic-(mts-bindtouchstart|bindmouse|bindwheel-view)$' --output midscene-original-results/pointer-csr/results --config playwright.original-evidence.config.ts

      - name: Validate original pointer event contracts (SSR)
        id: original-pointer-ssr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ORIGINAL_EVIDENCE_RUNNER: pointer-ssr
          ENABLE_SSR: "1"
        run: |
          echo "open files limit before: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
          ulimit -Sn "$(ulimit -Hn)"
          echo "open files limit after: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
          pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep 'basic-(mts-bindtouchstart|bindmouse|bindwheel-view)$' --output midscene-original-results/pointer-ssr/results --config playwright.original-evidence.config.ts

      - name: Validate original animation sampling (CSR)
        id: original-animation-csr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ENABLE_SSR: ""
          ORIGINAL_EVIDENCE_RUNNER: animation-csr
        # aiAct completes after its post-input planning, not at the input time.
        # Keep the original click-relative wait and pixel matcher unchanged.
        run: pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep 'api-animate$' --output midscene-original-results/animation-csr/results --config playwright.original-evidence.config.ts

      - name: Validate original ambiguous block inputs (CSR)
        id: original-lazy-components-csr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ENABLE_SSR: ""
          ORIGINAL_EVIDENCE_RUNNER: lazy-components-csr
        # Same-color cells have no visible boundary. Keep the two indexed lazy
        # inputs and the distinct target/reload clicks, waits and exact reads.
        run: pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep '(basic-lazy-component-multi(-import)?|basic-lynx-reload)$' --output midscene-original-results/lazy-components-csr/results --config playwright.original-evidence.config.ts

      - name: Validate original layout and style performance budgets
        id: original-performance
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          ORIGINAL_EVIDENCE_RUNNER: performance
          PORT: "3081"
        run: pnpm exec playwright test tests/performance.test.ts --project chromium --workers=2 --output midscene-original-results/performance/results --config playwright.original-evidence.config.ts

      - name: Validate original SVG selection and iframe API contracts
        id: original-svg-selection-webview
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          PORT: "3081"
          ORIGINAL_EVIDENCE_RUNNER: svg-selection-webview
        run: pnpm exec playwright test tests/x-svg-inline.spec.ts tests/x-text-selection.spec.ts tests/x-webview.spec.ts --project chromium --project firefox --project webkit --workers=2 --output midscene-original-results/svg-selection-webview/results --config playwright.original-evidence.config.ts

      - name: Validate original Markdown rendering and API contracts
        id: original-markdown
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          ORIGINAL_EVIDENCE_RUNNER: markdown
          PORT: "3081"
        # The excluded user-click flow is translated in markdown-events.yaml.
        run: pnpm exec playwright test tests/x-markdown.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep-invert 'should fire bindlink and bindimageTap events' --output midscene-original-results/markdown/results --config playwright.original-evidence.config.ts

      - name: Validate original mouse drag and wheel contracts
        id: original-drag-wheel
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          ORIGINAL_EVIDENCE_RUNNER: drag-wheel
          PORT: "3081"
        # Exact mouse trajectories, pointer delivery and wheel deltas are inputs
        # under test. Keep the complete source suites and original browser skips.
        run: pnpm exec playwright test tests/scroll-view-mouse-drag.spec.ts tests/x-foldview-ng-wheel.spec.ts --project chromium --project firefox --project webkit --workers=2 --output midscene-original-results/drag-wheel/results --config playwright.original-evidence.config.ts

      - name: Validate original list API and orientation contracts
        id: original-list-api
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          PORT: "3081"
          ORIGINAL_EVIDENCE_RUNNER: list-api
        # Preserve evaluateHandle/jsonValue boundaries, separate geometry reads
        # and scrollBy interception around the original animation-frame barrier.
        run: pnpm exec playwright test tests/web-elements.spec.ts --project chromium --project firefox --project webkit --workers=2 --grep 'x-list (auto-scroll-follows-orientation|get-visible-cells|get-scroll-container-info(-horizontal)?)$' --output midscene-original-results/list-api/results --config playwright.original-evidence.config.ts

      - name: Validate original Rust and TypeScript template consistency
        id: original-template
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          ORIGINAL_EVIDENCE_RUNNER: template
          PORT: "3081"
        # No browser interaction exists in this source test; execute it once.
        run: pnpm exec playwright test tests/template.spec.ts --project chromium --workers=2 --output midscene-original-results/template/results --config playwright.original-evidence.config.ts

      - name: Validate retained input collection without launching browsers
        id: retained-collection
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        run: node packages/web-platform/web-core-e2e/midscene/scripts/check-retained-input-collection.mjs

      - name: Validate remaining original React contracts (CSR)
        id: original-bulk-react-csr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ENABLE_SSR: ""
          ORIGINAL_EVIDENCE_RUNNER: bulk-react-csr
        run: pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --output midscene-original-results/bulk-react-csr/results --config playwright.original-evidence.config.ts

      - name: Validate remaining original React contracts (SSR)
        id: original-bulk-react-ssr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ENABLE_SSR: "1"
          ORIGINAL_EVIDENCE_RUNNER: bulk-react-ssr
        run: pnpm exec playwright test tests/reactlynx.spec.ts --project chromium --project firefox --project webkit --workers=2 --output midscene-original-results/bulk-react-ssr/results --config playwright.original-evidence.config.ts

      - name: Validate remaining original component contracts
        id: original-bulk-elements
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          PORT: "3081"
          ORIGINAL_EVIDENCE_RUNNER: bulk-elements
        run: pnpm exec playwright test tests/web-elements.spec.ts --project chromium --project firefox --project webkit --workers=2 --output midscene-original-results/bulk-elements/results --config playwright.original-evidence.config.ts

      - name: Validate original remaining Firefox and WebKit core contracts (CSR)
        id: original-browser-core-csr
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        env:
          ENABLE_SSR: ""
          ORIGINAL_EVIDENCE_RUNNER: browser-core-csr
        run: pnpm exec playwright test tests/reactlynx-css-var-fallback.spec.ts tests/reactlynx.spec.ts tests/ssr-no-js.spec.ts --project firefox --project webkit --workers=2 --output midscene-original-results/browser-core-csr/results --config playwright.original-evidence.config.ts

      - name: Validate original remaining Firefox and WebKit component contracts
        id: original-browser-elements
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          PORT: "3081"
          ORIGINAL_EVIDENCE_RUNNER: browser-elements
        run: pnpm exec playwright test tests/component-event.spec.ts tests/web-elements.spec.ts tests/x-markdown.spec.ts --project firefox --project webkit --workers=2 --output midscene-original-results/browser-elements/results --config playwright.original-evidence.config.ts

      - name: Preserve existing original runner evidence before moving artifacts
        if: always()
        env:
          ORIGINAL_RUNNER_OUTCOMES: >-
            {"keyboard-csr":"${{ steps.original-keyboard-csr.outcome }}","keyboard-ssr":"${{ steps.original-keyboard-ssr.outcome }}","animation-csr":"${{ steps.original-animation-csr.outcome }}","lazy-components-csr":"${{ steps.original-lazy-components-csr.outcome }}","list-api":"${{ steps.original-list-api.outcome }}","svg-selection-webview":"${{ steps.original-svg-selection-webview.outcome }}","runtime":"${{ steps.original-runtime.outcome }}","pointer-csr":"${{ steps.original-pointer-csr.outcome }}","pointer-ssr":"${{ steps.original-pointer-ssr.outcome }}","performance":"${{ steps.original-performance.outcome }}","markdown":"${{ steps.original-markdown.outcome }}","drag-wheel":"${{ steps.original-drag-wheel.outcome }}","template":"${{ steps.original-template.outcome }}","bulk-react-csr":"${{ steps.original-bulk-react-csr.outcome }}","bulk-react-ssr":"${{ steps.original-bulk-react-ssr.outcome }}","bulk-elements":"${{ steps.original-bulk-elements.outcome }}","browser-core-csr":"${{ steps.original-browser-core-csr.outcome }}","browser-elements":"${{ steps.original-browser-elements.outcome }}"}
        run: node packages/web-platform/web-core-e2e/midscene/scripts/write-original-runner-evidence.mjs

      - name: Validate original keyboard and input contracts with evidence
        id: retained-inputs
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' && steps.retained-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        env:
          PORT: "3081"
        # Original callbacks, profiles and retry budgets are unchanged.
        # Screenshots are collected after each original callback completes.
        run: pnpm exec playwright test --config playwright.retained-inputs.config.ts --project chromium --project firefox --project webkit --workers=2 --output midscene-original-results/retained-inputs/results

      - name: Preserve retained input evidence before moving artifacts
        if: always()
        env:
          RETAINED_RESULT: ${{ steps.retained-inputs.outcome }}
        run: |
          evidence=packages/web-platform/web-elements/midscene-original-results/retained-inputs
          mkdir -p "$evidence"
          node packages/web-platform/web-core-e2e/midscene/scripts/write-retained-input-evidence.mjs "$(realpath "$evidence")" "$RETAINED_RESULT"

      - name: Start web-core-e2e dev shell
        id: core-ready
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e
        run: |
          nohup pnpm run serve > /tmp/web-shell.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS 'http://localhost:3080/?casename=basic-bindtap' >/dev/null; then
              echo "dev shell is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error:: dev shell did not become ready" >&2
          cat /tmp/web-shell.log >&2 || true
          exit 1

      - name: Start independent web-elements fixture server
        id: elements-ready
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-elements
        run: |
          PORT=3081 nohup pnpm run serve > /tmp/web-elements.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS 'http://localhost:3081/tests/fixtures/x-view/dataset-attr-false-value.html' >/dev/null; then
              echo "web-elements fixture server is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error:: web-elements fixture server did not become ready" >&2
          cat /tmp/web-elements.log >&2 || true
          exit 1

      - name: Validate case collection and exact assertion contracts
        id: case-contracts
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: |
          npm run typecheck
          node --test scripts/*.test.mjs

      - name: Validate original SSR loader and visual target geometry
        id: visual-prerequisites
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' && steps.core-ready.outcome == 'success' && steps.elements-ready.outcome == 'success' && steps.case-contracts.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: |
          node scripts/check-ssr-client.mjs
          node scripts/check-swiper-target.mjs

      - name: Run Web Midscene cases
        id: run-cases
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' && steps.original-collection.outcome == 'success' && steps.model-compatible.outcome == 'success' && steps.core-ready.outcome == 'success' && steps.elements-ready.outcome == 'success' && steps.case-contracts.outcome == 'success' && steps.visual-prerequisites.outcome == 'success' }}
        working-directory: packages/web-platform/web-core-e2e/midscene
        env: *midscene-model-env
        run: |
          echo "open files limit before: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
          ulimit -Sn "$(ulimit -Hn)"
          echo "open files limit after: soft=$(ulimit -Sn), hard=$(ulimit -Hn)"
          node scripts/check-fixture-style.mjs
          timeout --signal=TERM --kill-after=10s 120m npm test

      - name: Upload retained original runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-original-runner-diagnostics-${{ github.run_attempt }}
          path: |
            packages/web-platform/web-core-e2e/test-results
            packages/web-platform/web-elements/test-results
            packages/web-platform/web-core-e2e/midscene-original-results
            packages/web-platform/web-elements/midscene-original-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage Web report for this attempt
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.run-cases.outcome }}
          PRODUCER_RESULT: ${{ steps.run-cases.outcome == 'success' && 'success' || 'failure' }}
        run: |
          target="$RUNNER_TEMP/midscene-upload/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$target"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$target/attempt.txt"
          report=packages/web-platform/web-core-e2e/midscene/midscene_run
          if [ -d "$report" ]; then
            cp -R "$report"/. "$target"/
          fi
          inventory=packages/web-platform/web-core-e2e/midscene/midscene-inventory
          if [ -f "$inventory/expected-cases.json" ]; then
            node packages/web-platform/web-core-e2e/midscene/scripts/expected-cases.mjs status "$EXECUTION_OUTCOME"
            cp "$inventory/expected-cases.json" "$inventory/execution-status.json" "$target"/
          fi
          retained=packages/web-platform/web-elements/midscene-original-results/retained-inputs
          if [ -d "$retained" ]; then
            cp -R "$retained" "$target/retained-inputs"
          fi
          mkdir -p "$target/original-runners"
          for runner in keyboard-csr keyboard-ssr animation-csr lazy-components-csr runtime pointer-csr pointer-ssr bulk-react-csr bulk-react-ssr browser-core-csr; do
            source="packages/web-platform/web-core-e2e/midscene-original-results/$runner"
            if [ -d "$source" ]; then cp -R "$source" "$target/original-runners/$runner"; fi
          done
          for runner in list-api svg-selection-webview performance markdown drag-wheel template bulk-elements browser-elements; do
            source="packages/web-platform/web-elements/midscene-original-results/$runner"
            if [ -d "$source" ]; then cp -R "$source" "$target/original-runners/$runner"; fi
          done
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({sha: process.env.GITHUB_SHA, attempt: Number(process.env.GITHUB_RUN_ATTEMPT), result: process.env.PRODUCER_RESULT}))' "$target/result.json"

      - name: Upload Web report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}/midscene-upload
          if-no-files-found: warn
          retention-days: 14

      - name: Add Web results to the job Summary
        if: always()
        env:
          PRODUCER_RESULT: ${{ steps.run-cases.outcome == 'success' && steps.upload-report.outcome == 'success' && 'success' || 'failure' }}
        run: |
          node packages/web-platform/web-core-e2e/midscene/scripts/render-ci-summary.mjs \
            --title "Lynx Web × Midscene" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --links-published false \
            --entry "Web=$RUNNER_TEMP/midscene-upload/attempt-$GITHUB_RUN_ATTEMPT" \
            --result "Web=$PRODUCER_RESULT" \
            --artifact "Web=midscene-ai-e2e-web-$GITHUB_RUN_ATTEMPT" \
            --site-prefix "runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --site-dir "$RUNNER_TEMP/midscene-job-summary" \
            --job-summary-only true \
            --output "$GITHUB_STEP_SUMMARY"

      - name: Upload dev shell log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-log-web-shell-${{ github.run_attempt }}
          path: |
            /tmp/web-shell.log
            /tmp/web-elements.log
          if-no-files-found: ignore
          retention-days: 14

  pages-report:
    name: Publish report and evidence summary
    outputs:
      ready: ${{ steps.upload-publication.outcome == 'success' }}
    needs: [web-shell-ai-e2e]
    concurrency:
      group: midscene-report-generation-${{ github.run_id }}
      cancel-in-progress: false
    if: >-
      always() &&
      !cancelled() &&
      needs.web-shell-ai-e2e.result != 'skipped' &&
      github.event_name != 'schedule' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
      github.ref_name == (vars.MIDSCENE_PAGES_BRANCH || github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/web-platform/web-core-e2e/midscene/package-lock.json

      - name: Install Midscene report dependencies
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: npm ci --no-audit --no-fund

      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-ai-e2e-web-*
          path: ${{ runner.temp }}/midscene-artifacts
          merge-multiple: false

      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false

      - name: Explain unavailable Pages
        if: steps.pages.outcome != 'success'
        run: |
          message="GitHub Pages is unavailable. Select Settings > Pages > Build and deployment > Source > GitHub Actions."
          echo "::warning::$message"
          echo "$message Results and reports remain available in the test job Summary and Actions artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Show unpublished case evidence
        if: steps.pages.outcome != 'success'
        env:
          REPORT_LINKS_PUBLISHED: "false"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRODUCER_RESULT: ${{ needs.web-shell-ai-e2e.result }}
        run: |
          status=0
          node packages/web-platform/web-core-e2e/midscene/scripts/publish-report.mjs || status=$?
          if [ -f "$RUNNER_TEMP/midscene-publication/summary.md" ]; then
            cat "$RUNNER_TEMP/midscene-publication/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Test the evidence renderer
        if: steps.pages.outcome == 'success'
        run: |
          node --test packages/web-platform/web-core-e2e/midscene/scripts/*.test.mjs
          node --test .github/scripts/vision-preflight.test.mjs

      - name: Build native Midscene report and linked screenshot summary
        id: build-report
        continue-on-error: true
        if: steps.pages.outcome == 'success'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}/midscene
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRODUCER_RESULT: ${{ needs.web-shell-ai-e2e.result }}
        run: |
          status=0
          node packages/web-platform/web-core-e2e/midscene/scripts/publish-report.mjs || status=$?
          if [ -f "$RUNNER_TEMP/midscene-publication/rendered.json" ]; then
            echo 'rendered=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Add complete case evidence table to Summary
        if: always() && !cancelled() && steps.build-report.outputs.rendered == 'true'
        run: |
          {
            echo 'Report links below become available after the Pages deployment job succeeds.'
            echo ''
            cat "$RUNNER_TEMP/midscene-publication/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report publication bundle
        id: upload-publication
        if: always() && !cancelled() && steps.build-report.outputs.rendered == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/midscene-publication
          if-no-files-found: error

      - name: Retain oversized Summary diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-summary-overflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/midscene-publication/site/summary-overflow.md
            ${{ runner.temp }}/midscene-publication/site/summary-overflow.json
          if-no-files-found: ignore

      - name: Preserve evidence validation failure after retaining its report
        if: always() && !cancelled() && steps.build-report.outcome == 'failure'
        run: exit 1

      - name: Explain report publication failure
        if: failure()
        run: |
          echo '❌ Report publication preparation failed. Raw HTML reports remain in the run artifacts. Check the job log, Pages configuration, and report dependencies.' >> "$GITHUB_STEP_SUMMARY"

  publish-pages:
    needs: pages-report
    if: always() && !cancelled() && needs.pages-report.outputs.ready == 'true'
    uses: ./.github/workflows/workflow-pages.yml
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    with:
      component: midscene
      artifact: midscene-publication-${{ github.run_attempt }}
