name: Midscene AI E2E (web-core shell)

# AI-driven E2E on lynx-stack's web-core-e2e dev shell.
# Overlays Midscene vision on top of Playwright: the ReactLynx page renders
# inside a <lynx-view> closed shadow/worker where DOM selectors cannot reach;
# Midscene drives and asserts it visually.
#
# Required repository secrets:
#   MIDSCENE_MODEL_API_KEY / NAME / BASE_URL / FAMILY
# Optional:
#   MIDSCENE_MODEL_REASONING_ENABLED
# Optional repository variables:
#   MIDSCENE_PAGES_BRANCH  e.g. "main" — publish HTML report to GitHub Pages
#                          on pushes to that branch. Same-repository pull
#                          requests also publish review evidence.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &ai-e2e-paths
      - ".github/workflows/midscene-web.yml"
      - "packages/web-platform/web-core-e2e/midscene/**"
      - "packages/web-platform/web-core-e2e/{rsbuild.config.ts,package.json,shell-project/**,tests/reactlynx/**}"
      - "packages/web-platform/web-core/**"
      - "packages/web-platform/web-elements/**"
  pull_request:
    branches: [main]
    paths: *ai-e2e-paths

permissions:
  contents: read

concurrency:
  group: midscene-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
  MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
  MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
  MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
  MIDSCENE_MODEL_REASONING_ENABLED: ${{ secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
  NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection

jobs:
  web-shell-ai-e2e:
    name: Midscene AI E2E · Web (web-core shell)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same image the official Playwright web jobs use: browsers preinstalled
    # (/ms-playwright) and system libraries ready for headless Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-resolute
      env:
        CI: "1"
        TURBO_TELEMETRY_DISABLED: "1"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.4.0 --activate
          pnpm --version

      - name: Preflight model endpoint
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: bash ../../../../.github/scripts/preflight-model.sh

      - name: Install Rust toolchain (web-core build:wasm)
        # Container jobs default to `sh` (dash), which has no `source`;
        # pin bash explicitly.
        shell: bash
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config curl ca-certificates >/dev/null
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 -fsSL https://sh.rustup.rs \
              | sh -s -- --default-toolchain none -y
          fi
          . "$HOME/.cargo/env"
          # rust-toolchain.toml pins channel 1.97.1; install its wasm targets.
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown wasm32-wasip1
          # Make cargo/rustc available to every later step (turbo build:wasm).
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web-core-e2e dependency closure
        # Includes web-core (Rust -> wasm), rspeedy and the ReactLynx plugin
        # chain; the package's own build:csr emits dist/*.web.bundle.
        run: |
          pnpm turbo build --filter='@lynx-js/web-core-e2e...'

      - name: Start web-core-e2e dev shell
        working-directory: packages/web-platform/web-core-e2e
        run: |
          nohup pnpm run serve > /tmp/web-shell.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS 'http://localhost:3080/?casename=basic-bindtap' >/dev/null; then
              echo "dev shell is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error:: dev shell did not become ready" >&2
          cat /tmp/web-shell.log >&2 || true
          exit 1

      - name: Install Midscene test dependencies
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: npm ci --no-audit --no-fund

      - name: Run Web Midscene cases
        working-directory: packages/web-platform/web-core-e2e/midscene
        run: npm test -- --project web-shell

      - name: Upload Web report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-web
          path: packages/web-platform/web-core-e2e/midscene/midscene_run/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dev shell log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-web-shell-log
          path: /tmp/web-shell.log
          if-no-files-found: ignore
          retention-days: 14

  pages-report:
    name: Publish report and evidence summary
    needs: [web-shell-ai-e2e]
    if: >-
      always() &&
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
      github.ref_name == vars.MIDSCENE_PAGES_BRANCH))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: midscene-ai-e2e-web
          path: ${{ runner.temp }}/midscene-report

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Test the evidence renderer
        run: node --test packages/web-platform/web-core-e2e/midscene/scripts/render-ci-summary.test.mjs

      - name: Build Pages report and linked screenshot summary
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEB_RESULT: ${{ needs.web-shell-ai-e2e.result }}
        run: |
          node packages/web-platform/web-core-e2e/midscene/scripts/render-ci-summary.mjs \
            --title "Lynx Web × Midscene" \
            --run-url "$RUN_URL" \
            --pages-url "$PAGES_URL" \
            --entry "Web=$RUNNER_TEMP/midscene-report" \
            --result "Web=$WEB_RESULT" \
            --artifact "Web=midscene-ai-e2e-web" \
            --site-dir "$RUNNER_TEMP/pages-site" \
            --output "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: midscene-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: midscene-pages-${{ github.run_attempt }}
