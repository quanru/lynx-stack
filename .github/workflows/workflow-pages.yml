name: Publish website and Midscene reports

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      artifact:
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pages-site-publisher
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/pages-incoming
      - name: Restore the shared site archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          archive="$RUNNER_TEMP/pages-site-archive"
          git init "$archive"
          git -C "$archive" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          status=0
          git -C "$archive" ls-remote --exit-code origin refs/heads/pages-site-archive || status=$?
          if [ "$status" = 0 ]; then
            git -C "$archive" fetch --depth=1 origin refs/heads/pages-site-archive
            git -C "$archive" checkout -b pages-site-archive FETCH_HEAD
          elif [ "$status" = 2 ]; then
            git -C "$archive" checkout --orphan pages-site-archive
            # Preserve existing fork Summary URLs from the report-only site.
            # Upstream has an independent website and must wait for its build.
            if [ "$GITHUB_REPOSITORY" != lynx-family/lynx-stack ]; then
              legacy_status=0
              git -C "$archive" ls-remote --exit-code origin refs/heads/midscene-pages-archive || legacy_status=$?
              if [ "$legacy_status" = 0 ]; then
                git -C "$archive" fetch --depth=1 origin refs/heads/midscene-pages-archive
                git -C "$archive" archive FETCH_HEAD | tar -xf - -C "$archive"
              elif [ "$legacy_status" != 2 ]; then
                exit "$legacy_status"
              fi
            fi
          else
            exit "$status"
          fi
      - name: Compose and archive the site
        id: compose
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: |
          incoming="$RUNNER_TEMP/pages-incoming"
          if [ "$COMPONENT" = midscene ]; then incoming="$incoming/site"; fi
          archive="$RUNNER_TEMP/pages-site-archive"
          node .github/scripts/compose-pages-site.mjs "$archive" "$incoming" "$COMPONENT" "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          git -C "$archive" config user.name github-actions[bot]
          git -C "$archive" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$archive" add -A
          if ! git -C "$archive" diff --cached --quiet; then
            git -C "$archive" commit -m "docs: archive $COMPONENT site from run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            git -C "$archive" push origin HEAD:refs/heads/pages-site-archive
          fi
          mkdir -p "$RUNNER_TEMP/pages-site"
          git -C "$archive" archive HEAD | tar -xf - -C "$RUNNER_TEMP/pages-site"
      - name: Wait for the first website build
        if: steps.compose.outputs.ready != 'true'
        run: |
          echo 'Reports are archived. The first successful Deploy website build will publish them under /midscene/ while preserving the existing website.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.compose.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.compose.outputs.ready == 'true'
        with:
          name: composed-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        if: steps.compose.outputs.ready == 'true'
        with:
          artifact_name: composed-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Add published report evidence to Summary
        if: steps.deployment.outcome == 'success' && inputs.component == 'midscene'
        run: cat "$RUNNER_TEMP/pages-incoming/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain publication failure
        if: failure()
        run: |
          echo '❌ Pages publication failed. Download the report artifact from this run. Check the failed step, archive branch write access, Settings → Pages → GitHub Actions, and the github-pages environment deployment rules.' >> "$GITHUB_STEP_SUMMARY"
