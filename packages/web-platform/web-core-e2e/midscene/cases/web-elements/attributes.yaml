# Original input and textarea attribute propagation contracts; no visual approximation.
cases:
  - name: web-elements/x-input/attribute-type-digit
    steps:
      - gotoUrl: "${elementsUrl}tests/fixtures/x-input/attribute-type-digit.html"
      - javascript: "document.fonts.ready.then(() => true)"
      - recordToReport: Before checking the original inputmode attribute
      - web.expect: {
          selector: "input",
          attribute: inputmode,
          equals: "numeric",
        }
      - recordToReport: Original inputmode attribute contract passed
