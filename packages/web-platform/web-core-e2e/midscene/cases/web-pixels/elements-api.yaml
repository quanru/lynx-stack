      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 100))
      - javascript: |-
          ((target) => {
                  target.setValue({
                      value: 'add-text',
                      index: 3,
                  });
              })(document.querySelector("#target"))
      - javascript: |-
          ((target) => {
                  target.addText({
                      text: '3',
                  });
              })(document.querySelector("#target"))
      - web.pixels:
          suite: web-elements
          baseline: x-input/method-setValue/add3-text
