afterEach:
  - recordToReport: Programmatic scroll method pixel evidence, including failures
cases:
  - name: web-elements/scroll-view/scroll-to
    steps:
      - gotoUrl: ${elementsUrl}tests/fixtures/scroll-view/scroll-to.html
      - javascript: document.fonts.ready.then(() => true)
      - web.pixels:
          suite: web-elements
          baseline: scroll-view/scroll-to/initial
      - javascript: "new Promise((resolve, reject) => { const deadline = Date.now() + 30000; const check = () => { const matches = document.querySelectorAll(\"scroll-view\"); if (matches.length > 1) return reject(new Error('Original scroll API locator strictness violation')); if (matches.length === 1) { try { return resolve(((e) => e.scrollTo({ index: 2 }))(matches[0])); } catch (error) { return reject(error); } } if (Date.now() >= deadline) return reject(new Error('Original scroll API locator attachment timed out')); requestAnimationFrame(check); }; check(); })"
      - web.pixels:
          suite: web-elements
          baseline: scroll-view/scroll-to/scroll-to-two
      - javascript: "new Promise((resolve, reject) => { const deadline = Date.now() + 30000; const check = () => { const matches = document.querySelectorAll(\"scroll-view\"); if (matches.length > 1) return reject(new Error('Original scroll API locator strictness violation')); if (matches.length === 1) { try { return resolve(((e) => e.scrollTo({ index: 0 }))(matches[0])); } catch (error) { return reject(error); } } if (Date.now() >= deadline) return reject(new Error('Original scroll API locator attachment timed out')); requestAnimationFrame(check); }; check(); })"
      - web.pixels:
          suite: web-elements
          baseline: scroll-view/scroll-to/back-to-zero
      - javascript: "new Promise((resolve, reject) => { const deadline = Date.now() + 30000; const check = () => { const matches = document.querySelectorAll(\"scroll-view\"); if (matches.length > 1) return reject(new Error('Original scroll API locator strictness violation')); if (matches.length === 1) { try { return resolve(((e) => e.scrollTo({ offset: 50 }))(matches[0])); } catch (error) { return reject(error); } } if (Date.now() >= deadline) return reject(new Error('Original scroll API locator attachment timed out')); requestAnimationFrame(check); }; check(); })"
      - web.pixels:
          suite: web-elements
          baseline: scroll-view/scroll-to/offset-50
      - javascript: "new Promise((resolve, reject) => { const deadline = Date.now() + 30000; const check = () => { const matches = document.querySelectorAll(\"scroll-view\"); if (matches.length > 1) return reject(new Error('Original scroll API locator strictness violation')); if (matches.length === 1) { try { return resolve(((e) => e.scrollTo({ offset: 50, index: 2 }))(matches[0])); } catch (error) { return reject(error); } } if (Date.now() >= deadline) return reject(new Error('Original scroll API locator attachment timed out')); requestAnimationFrame(check); }; check(); })"
      - web.pixels:
          suite: web-elements
          baseline: scroll-view/scroll-to/offset-50-and-index-2
