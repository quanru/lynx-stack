afterEach:
  - recordToReport: Original nested-title pixel contract result
cases:
  - name: web-elements/x-text/text-maxline-basic
    steps:
      - gotoUrl: ${elementsUrl}tests/fixtures/x-text/text-maxline-basic.html
      - javascript: document.fonts.ready.then(() => true)
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 100))
