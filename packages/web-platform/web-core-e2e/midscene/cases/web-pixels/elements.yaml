afterEach:
  - recordToReport: Original text, image, SVG and input pixel contract result
cases:
  - name: basic-element-text-maxline
    steps:
      - gotoUrl: "${shellUrl}?casename=basic-element-text-maxline"
      - javascript: "document.fonts.ready.then(() => true)"
      - javascript: "new Promise(resolve => setTimeout(() => resolve(true), 100))"
      - web.pixels: { baseline: text/maxline/index }
