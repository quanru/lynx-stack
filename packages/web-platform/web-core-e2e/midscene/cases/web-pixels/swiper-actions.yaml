afterEach:
  - recordToReport: Original swiper and list pixel contract result
cases:
  - name: basic-element-x-swiper-mode-normal
    steps:
      - gotoUrl: ${shellUrl}?casename=basic-element-x-swiper-mode-normal
      - javascript: document.fonts.ready.then(() => true)
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 100))
      - web.pixels:
          baseline: x-swiper/mode-normal/index
      - aiAct:
          prompt: Click once in the center of the red panel with a black border at the top
            of the page. Do not swipe or perform another action.
          options:
            deepLocate: true
            cacheable: false
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 500))
      - web.pixels:
          baseline: x-swiper/mode-normal-last-child/index
