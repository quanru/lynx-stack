cases:
  - name: basic-lazy-component-when-need-with-itself
    steps:
      - gotoUrl: "${shellUrl}?casename=basic-lazy-component-when-need-with-itself"
      - aiWaitFor: A red square labelled Load Component appears below a green-and-blue row.
      - aiAct: Click the red square labelled "Load Component" once. Stop after that single click.
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(0, 128, 0)",
        }
      - aiAct: Click the BLUE square on the RIGHT in the upper row ABOVE the red Load Component square once, so its LEFT green neighbor becomes pink. Do not click the lower row. Stop after that single click.
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - aiAct: Click the same red square labelled "Load Component" exactly one time. Stop after that single click.
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - web.expect: {
          selector: "#target1",
          index: 1,
          css: background-color,
          equals: "rgb(0, 128, 0)",
        }
      - aiAct: Click the BLUE square on the RIGHT in the lower row BELOW the red Load Component square once, so its LEFT green neighbor becomes pink. Do not click the upper row. Stop after that single click.
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - web.expect: {
          selector: "#target1",
          index: 1,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - recordToReport: Original lazy-component instance isolation and all six computed styles passed
