cases:
  - name: basic-lazy-component-when-need-with-itself
    steps:
      - gotoUrl: "${shellUrl}?casename=basic-lazy-component-when-need-with-itself"
      - javascript: document.fonts.ready.then(() => true)
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 500))
      - recordToReport: Original source checkpoint before interaction
      - aiAct:
          prompt: "Click the RED square with no visible text directly below the top row's GREEN square once. Stop after that single click."
          options: { effort: deepThink, deepLocate: false, cacheable: false }
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 300))
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(0, 128, 0)",
        }
      - aiAct:
          prompt: "Click the BLUE square on the RIGHT in the upper row ABOVE the RED square once, so its LEFT green neighbor becomes pink. Do not click the lower row. Stop after that single click."
          options: { effort: deepThink, deepLocate: false, cacheable: false }
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 100))
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - aiAct:
          prompt: "Click the same RED square with no visible text BETWEEN the upper and lower rows exactly one time. Stop after that single click."
          options: { effort: deepThink, deepLocate: false, cacheable: false }
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 100))
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - web.expect: {
          selector: "#target1",
          index: 1,
          css: background-color,
          equals: "rgb(0, 128, 0)",
        }
      - aiAct:
          prompt: "Click the BLUE square on the RIGHT in the lower row BELOW the RED square once, so its LEFT green neighbor becomes pink. Do not click the upper row. Stop after that single click."
          options: { effort: deepThink, deepLocate: false, cacheable: false }
      - javascript: new Promise(resolve => setTimeout(() => resolve(true), 100))
      - web.expect: {
          selector: "#target1",
          index: 0,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - web.expect: {
          selector: "#target1",
          index: 1,
          css: background-color,
          equals: "rgb(255, 192, 203)",
        }
      - recordToReport: Original ordered source CSS assertions passed
