# Preserve expectHasText's getByText(...).toHaveCount(1), not innerText inclusion.
cases:
  - name: basic-setsate-with-cb
    steps:
      - gotoUrl: "${shellUrl}?casename=basic-setsate-with-cb"
      - javascript: "document.fonts.ready.then(() => true)"
      - recordToReport: Before checking the original setState callback text counts
      - web.expect: { matchingText: awesome, count: 1 }
      - web.expect: { matchingText: success, count: 0 }
      - recordToReport: Original setState callback positive and negative text counts passed
  - name: external-bundle
    steps:
      - gotoUrl: "${shellUrl}?casename=external-bundle"
      - javascript: "document.fonts.ready.then(() => true)"
      - recordToReport: Before checking external bundle evaluation and stylesheet contracts
      - web.expect: { matchingText: hello-from-external, count: 1 }
      - web.expect: {
          selector: "#target",
          css: background-color,
          equals: "rgb(1, 2, 3)",
        }
      - recordToReport: Original external bundle contracts passed
  - name: api-requestAnimationFrame
    steps:
      - gotoUrl: "${shellUrl}?casename=api-requestAnimationFrame"
      - javascript: "document.fonts.ready.then(() => true)"
      - recordToReport: Before checking original animation frame callbacks
      - aiAct: Click the text "requestAnimationFrame" once. Do not click "cancelAnimationFrame". Stop after that single click.
      - web.expect: { matchingText: loop, count: 1 }
      - aiAct: Click the text "cancelAnimationFrame" once. Stop after that single click.
      - web.expect: { matchingText: stop, count: 1 }
      - recordToReport: Original animation frame callback contracts passed
  - name: api-animation-event
    steps:
      - gotoUrl: "${shellUrl}?casename=api-animation-event"
      - javascript: "document.fonts.ready.then(() => true)"
      - recordToReport: Before checking original transition and animation event sequences
      - aiAct: Click "toggle transition 1" beneath "view animator test" once. Stop after that single click.
      - web.expect: {
          selector: "#blue0",
          css: background-color,
          equals: "rgb(0, 0, 238)",
        }
      - web.expect: { matchingText: "transitionstart transitionend", count: 1 }
      - aiAct: Click "toggle animation 1" beneath "view animator test" once. Stop after that single click.
      - web.expect: {
          selector: "#blue0",
          css: background-color,
          equals: "rgb(0, 0, 238)",
        }
      - web.expect: {
          matchingText: "animationstart animationiteration animationend",
          count: 1,
        }
      - aiAct: Click "toggle transition 2" beneath "text animator test" once. Stop after that single click.
      - web.expect: {
          selector: "#blue1",
          css: background-color,
          equals: "rgb(0, 0, 238)",
        }
      - web.expect: {
          matchingText: "transitionstart transitionend transitionstart transitionend",
          count: 1,
        }
      - aiAct: Click "toggle animation 2" beneath "text animator test" once. Stop after that single click.
      - web.expect: {
          selector: "#blue1",
          css: background-color,
          equals: "rgb(0, 0, 238)",
        }
      - web.expect: {
          matchingText: "animationstart animationiteration animationend animationstart animationiteration animationend",
          count: 1,
        }
      - recordToReport: Original transition and animation event contracts passed
